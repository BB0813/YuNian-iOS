# XcodeGen 工程定义 —— iOS 侧应用工程
#
# 为什么用 XcodeGen 而不是提交 .xcodeproj：
#   .xcodeproj 是二进制/多文件格式，MR 冲突极难处理，且无法在没有 Mac 的机器上修改。
#   这里提交声明式的 project.yml，CI 与本地都执行 `xcodegen generate` 产出工程。
#
# 前置：先跑 scripts/build_agent_ios.sh（或下载 CI 产物），
#       使 ios/Generated/ 与 ios/Frameworks/ 存在。二者都是生成物，不入库。
#
# 生成与构建：
#   cd ios && xcodegen generate && open YuNian.xcodeproj
#   xcodebuild build -project YuNian.xcodeproj -scheme YuNian \
#     -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
#     CODE_SIGNING_ALLOWED=NO

name: YuNian
options:
  # ⚠️ 第 104 轮：默认 Bundle ID 从 com.yunian.ai 改为 com.bb0813.yunian。
  # 原 ID 很可能已被其他 Apple 账号注册，导致用户用爱思助手免费签名时报
  # 「描述文件生成失败」。CI 侧还会用命令行再覆盖一层（见 workflow）。
  bundleIdPrefix: com.bb0813.yunian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    # 与 Android 侧 Kotlin 2.2.10 / JVM 17 无关，iOS 侧独立；这里只固定我们自己的编译选项
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # 与 Android 的 applicationId com.yunian.ai 保持品牌一致
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # ⚠️ 第 80 轮：CommonCrypto 从 target 级**提升到工程级**。
    # 第 79 轮我只加在 YuNian target 的 OTHER_LDFLAGS 上，
    # 结果 CI 仍报 "cannot find 'CCKeyDerivationPBKDF2' in scope" ——
    # 因为 @testable import 会为 YuNianTests target 再编译一遍生产源码，
    # 而 YuNianTests **不继承** YuNian 的 OTHER_LDFLAGS。
    # 放这里两个 target 都能拿到。
    # ⚠️ 第 97 轮：删掉 `-framework CommonCrypto`。
    # 它是我第 79 轮为修 CCKeyDerivationPBKDF2 加的，第 80 轮提升到工程级。
    # 但第 81 轮我**已改用 CryptoKit 自建 PBKDF2**（BackupKDF.swift），
    # 完全不再依赖 CommonCrypto —— 却把这个链接标志留下了。
    # 结果 CI 链接期报：
    #     ld: framework 'CommonCrypto' not found
    # （模拟器 SDK 里 CommonCrypto 不是可链接 framework。）
    #
    # 教训与第 61/73/94/95 轮的"两份副本互相覆盖"同族：
    # **修掉一个依赖后，要连它引入的构建标志一起清**。我只清了 import，
    # 没清 linker flag，于是一个已解决的问题以新形态回来了。
    OTHER_LDFLAGS:
      - "-lc++"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    # 6.x：DatabasePool / Row / StatementArguments API 与本仓库用法一致
    from: 6.29.0

targets:
  YuNian:
    type: application
    platform: iOS
    sources:
      - path: YuNian
      # UniFFI 生成的 Swift API（由 build_agent_ios.sh / CI 产出，不入库）
      - path: Generated
        optional: true

    dependencies:
      - package: GRDB
        product: GRDB
      # Rust Agent 的静态库切片（含 lianyu_agentFFI.h 与 module.modulemap）
      - framework: Frameworks/lianyu_agent.xcframework
        embed: false
        optional: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bb0813.yunian
        INFOPLIST_FILE: YuNian/Resources/Info.plist
        # ⚠️ 免费 Apple ID 无法启用 Push Notifications capability。
        #    需要 APNs 时必须使用付费开发者账号 —— 见 docs/ios-port-feasibility.md §3.2。
        #    在账号就位前不要打开下面的 entitlements 引用，否则签名会失败。
        # CODE_SIGN_ENTITLEMENTS: YuNian/Resources/YuNian.entitlements
        # ⚠️ 第 80 轮：OTHER_LDFLAGS 已提升到工程级 settings.base
        # （CommonCrypto 要让 YuNianTests 也拿到 —— @testable import
        #  会为测试 target 再编译一遍生产源码）。这里只留 Rust 相关项。
        # Rust 静态库需要显式保留这些（rustls/ring 用到）
        DEAD_CODE_STRIPPING: NO

    scheme:
      testTargets:
        - YuNianTests
      gatherCoverageData: false

  YuNianTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YuNianTests
      # 安全基线数据也要能在测试 bundle 里取到。
      #
      # ⚠️ 否则会踩一个只有真机才暴露的坑：单测运行时 `Bundle.main` 是
      #    **测试 bundle** 而不是 app，`SecuritySeedLoader.load()` 默认读 .main，
      #    取不到资源 → `ContentFilter.load()` 返回 false → 金标向量测试全失败。
      #    显式把该 JSON 复制进测试 target，测试侧改用 `Bundle(for:)` 读取。
      - path: YuNian/Resources/SecuritySeed.json
    dependencies:
      - target: YuNian
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bb0813.yunian.tests
        GENERATE_INFOPLIST_FILE: YES

# ── 测试策略 ────────────────────────────────────────────────────
# 当前只有一组测试，但它是跨端一致性里风险最高的那个组件：
# MessageSearchTokenizerTests 用**金标向量**锁死 token 格式
# （unigram u<hex>z / bigram b<hex>x<hex>z / 查询侧只用 bigram 并加引号）。
# 两端共用同一张 FTS 表，格式一旦偏离不会报错、只会「搜不到」，因此必须有测试兜住。
#
# 后续（M2/M3）应补充：
#   - YuNianSchema 与 Room v45 的表/索引数量一致性断言（生成器已内置，可在 Swift 侧再锁一次）
#   - RequestSigner 的 payload 逐字节断言（需要服务端给出的权威样例，见 V9）
#   - YuNianDatabase 的 user_version 引导分支（空库 / 41-45 / <41 / >45）
